				localStorage.getItem('today') || new Date().toLocaleString('fr-CA', { timeZone: 'Africa/Kigali' }).slice(0, 10);
			window.TIMEZONE = localStorage.getItem('_tz') || 'Africa/Kigali';</script><script defer="defer" src="/js/chunk-vendors.dac46755.js"></script><script defer="defer" src="/js/app.245c381f.js"></script><link href="/css/app.91f01283.css" rel="stylesheet"></head><body class="nk-body bg-white npc-general has-sidebar no-touch nk-nio-theme"><noscript><strong>We're sorry but This App doesn't work properly without JavaScript enabled. Please enable it to continue.</strong></noscript><div id="app"></div><script>window.onload = () => {
				document.addEventListener('click', (e) => {
					let item = e.target;
					if (
						item?.classList?.contains('dropdown-toggle') ||
						item?.parentElement?.classList.contains('dropdown-toggle')
					) {
						e.preventDefault();
						[...document.querySelectorAll('div.dropdown-menu')].forEach((elt) => {
							elt.classList.remove('show');
						});
						let li = null;
						if (item.classList.contains('dropdown-toggle')) li = item.parentElement;
						else li = item.parentElement.parentElement;
						li.classList.toggle('show');
						//li.querySelector("div.dropdown-menu").classList.toggle("show");
						const menu = li.querySelector('div.dropdown-menu');
						if (menu) {
							menu.classList.toggle('show');
						}
					} else if (item.closest('.dropdown-toggle')) {
						var li = item.parentElement;
						li.classList.toggle('show');
						const menu = li.querySelector('div.dropdown-menu');
						if (menu) {
							menu.classList.toggle('show');
						}
					} else {
						let isFilterElement = false;
						let elem = e.target;
						let clicked = e.target;
						while (
							elem.parentNode &&
							elem.parentNode.nodeName.toLowerCase() != 'body' &&
							!elem.classList.contains('filter-dropdown')
						) {
							elem = elem.parentNode;
							if (elem.classList && elem.classList.contains('filter-dropdown')) isFilterElement = true;
							//parents.push(elem);
						}

						if (
							!isFilterElement ||
							(isFilterElement && !['INPUT', 'BUTTON', 'DIV', 'SELECT', 'FORM'].includes(clicked.tagName))
						) {
							[...document.querySelectorAll('div.dropdown-menu')].forEach((elt) => {
								elt.classList.remove('show');
							});
						}
					}
				});
			};</script></body></html>
