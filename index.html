		<script>
			window.onload = () => {
				// Dropdown menu functionality
				const closeAllDropdowns = () => {
					document.querySelectorAll('div.dropdown-menu').forEach((menu) => {
						menu.classList.remove('show')
					})
					document.querySelectorAll('.dropdown-toggle').forEach((toggle) => {
						toggle.parentElement.classList.remove('show')
					})
				}

				document.addEventListener('click', (event) => {
					const clickedElement = event.target
					const dropdownToggle = clickedElement.closest('.dropdown-toggle')

					if (dropdownToggle) {
						// Handle dropdown toggle click
						event.preventDefault()

						const dropdownContainer = dropdownToggle.parentElement
						const isCurrentlyOpen = dropdownContainer.classList.contains('show')

						// Close all other dropdowns first
						closeAllDropdowns()

						// Toggle this dropdown (unless it's already open)
						if (!isCurrentlyOpen) {
							dropdownContainer.classList.add('show')
							const menu = dropdownContainer.querySelector('div.dropdown-menu')
							if (menu) {
								menu.classList.add('show')
							}
						}
					} else {
						// Handle clicks outside dropdowns
						const filterDropdown = clickedElement.closest('.filter-dropdown')
						const isInteractiveElement = ['INPUT', 'BUTTON', 'DIV', 'SELECT', 'FORM'].includes(
							clickedElement.tagName
						)

						// Close dropdowns if not clicking inside a filter dropdown or not on an interactive element within a filter
						if (!filterDropdown || (filterDropdown && !isInteractiveElement)) {
							closeAllDropdowns()
						}
					}
				})
			}
		</script>
